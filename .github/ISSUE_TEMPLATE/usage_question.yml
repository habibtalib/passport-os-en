name: Usage question
description: Ask for help building, flashing, configuring, or using AI Passport.
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Security vulnerabilities must be reported through .github/SECURITY.md, not here.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you blocked?
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board revision
      placeholder: For example, production board or PCB revision; write Unknown if unsure.
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Provide a release version, branch name, or commit SHA.
      placeholder: For example, v1.0.0 or ea9c823
    validations:
      required: true

  - type: input
    id: idf
    attributes:
      label: ESP-IDF version
      placeholder: For example, v5.5.3

  - type: textarea
    id: attempts
    attributes:
      label: Steps tried and observed result
      description: Include commands, expected behavior, and actual behavior.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste relevant logs after removing Wi-Fi credentials, tokens, device secrets, and personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed credentials, private device links, and personal data.
          required: true
