name: Feature request
description: Suggest an improvement to the firmware, BSP, hardware, or documentation.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Do not include credentials, private device links, or personal data.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem should this feature solve, and who benefits from it?
      placeholder: Describe the current limitation and the intended use case.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user-visible behavior and acceptance criteria.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Firmware or demo
        - BSP or hardware interface
        - Documentation or tooling
        - Hardware revision
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any workarounds or alternative designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs, diagrams, or links if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private device links, and personal data.
          required: true
